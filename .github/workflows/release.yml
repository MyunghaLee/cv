name: Build and publish CV

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cv-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      current: ${{ steps.freshness.outputs.current }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: '2026'

      - name: Check current commit
        id: freshness
        run: |
          current_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publication: master has advanced to $current_sha"
          fi

      - name: Publish latest release
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv main.pdf Myungha_Lee_CV.pdf
          tag="cv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Myungha_Lee_CV.pdf \
            --target "$GITHUB_SHA" \
            --title "CV build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA}." \
            --latest

      - name: Prepare browser version
        if: steps.freshness.outputs.current == 'true'
        run: |
          mkdir -p site
          cp Myungha_Lee_CV.pdf site/
          cp pages/index.html site/

      - name: Upload Pages files
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: release
    if: needs.release.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
